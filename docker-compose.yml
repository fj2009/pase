services:
  db:
    image: postgres:16-alpine
    container_name: pase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pase
      POSTGRES_USER: pase
      POSTGRES_PASSWORD: pase_local_owner
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pase_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pase -d pase"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pase_pgdata:
